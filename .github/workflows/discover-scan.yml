name: Monthly MCP Candidate Full Scan

on:
  schedule:
    - cron: '0 0 1 * *'  # 毎月1日 9:00 JST (UTC 0:00)
  workflow_dispatch:
    inputs:
      categories:
        description: "対象カテゴリslugをカンマ区切りで限定（空＝全カテゴリ）。試走用。"
        required: false
        default: ""
      max_per_category:
        description: "各カテゴリの先頭N件だけ評価（空＝全件）。試走用。"
        required: false
        default: ""

# notes/candidates_state.json は公開ポリシー基準2で非公開に倒した（e24e043）ため、
# このリポジトリにはコミットしない。run をまたぐ持ち越しは Actions の artifact で行う。
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # 一部カテゴリ／件数だけの試走。この結果を state として保存すると、
      # 走らせなかったサービスが次の月次で丸ごと「新規Tier1」に化けるので保存もIssue作成もしない。
      # schedule 実行では inputs が空。event_name を明示して、月次が誤って PARTIAL 扱いされないようにする。
      PARTIAL: ${{ (github.event_name == 'workflow_dispatch' && (inputs.categories != '' || inputs.max_per_category != '')) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx beautifulsoup4

      - name: Restore previous state from artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p notes
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=candidates-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse
                  | (first // {}) | .workflow_run.id // empty')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name candidates-state --dir notes
            echo "state 復元: run ${RUN_ID}（$(wc -c < notes/candidates_state.json) bytes）"
          else
            echo "state 無し。今回が初回として扱われ、Tier1 は全件が新規になります。"
          fi

      - name: Run full scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATEGORIES: ${{ inputs.categories }}
          MAX_PER_CATEGORY: ${{ inputs.max_per_category }}
        run: |
          # bash -e 下で `[ -n "$X" ] && ARGS+=(...)` を使うと、空のとき終了1でステップごと落ちる。
          ARGS=(--token "$GITHUB_TOKEN")
          if [ -n "$CATEGORIES" ]; then
            ARGS+=(--categories "$CATEGORIES")
          fi
          if [ -n "$MAX_PER_CATEGORY" ]; then
            ARGS+=(--max-per-category "$MAX_PER_CATEGORY")
          fi
          python scripts/discover_candidates.py "${ARGS[@]}"

      # スキャン成功時のみ保存する。0件で落ちた回に前回分を上書きさせない。
      - name: Save state as artifact
        if: env.PARTIAL == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidates-state
          path: notes/candidates_state.json
          retention-days: 90

      - name: Ensure candidate label exists
        if: env.PARTIAL == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create candidate --description "MCP開発候補（discover_candidates.py が検出）" --color "1D76DB" --force

      - name: Create one Issue per newly-surfaced Tier1 candidate
        if: env.PARTIAL == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(jq 'length' notes/new_tier1_candidates.json)
          echo "新規Tier1候補: ${COUNT}件"
          for i in $(seq 0 $((COUNT - 1))); do
            NAME=$(jq -r ".[$i].name" notes/new_tier1_candidates.json)
            CATEGORY=$(jq -r ".[$i].category" notes/new_tier1_candidates.json)
            DOMAIN=$(jq -r ".[$i].domain" notes/new_tier1_candidates.json)
            LINK=$(jq -r ".[$i].proni_url" notes/new_tier1_candidates.json)
            API_URL=$(jq -r ".[$i].signals.api_url" notes/new_tier1_candidates.json)
            EVIDENCE=$(jq -r ".[$i].signals.api_evidence | join(\" / \")" notes/new_tier1_candidates.json)

            BODY=$(printf '%s\n' \
              "新規に Tier1（即着手候補）入りしたサービスです。discover_candidates.py の自動巡回で検出されました。" \
              "" \
              "- サービス名: ${NAME}" \
              "- カテゴリ: ${CATEGORY}" \
              "- ドメイン: ${DOMAIN}" \
              "- API判定の根拠: ${EVIDENCE}" \
              "- API URL: ${API_URL}" \
              "- 出典（PRONIアイミツ）: ${LINK}" \
              "" \
              "## 着手前に必ずやること（docs/connector-candidates.md 参照）" \
              "" \
              "- [ ] 公式MCP・公式連携の有無を Web で裏取り（ベンダー発表・GitHub・mcp.<service>.com）" \
              "- [ ] API ドキュメントの実在と認証方式を確認" \
              "- [ ] テスト用クレデンシャルの取得可否を確認（アカウント登録が必要な場合あり）" \
              "- [ ] docs/connector-candidates.md の A/B/C/D 軸でスコアリングし、9点以上か確認" \
              "- [ ] リポジトリ直下・archive/ に同種コネクタが無いか重複チェック" \
              "" \
              "上記が揃ったら着手可否を判断してください。")

            gh issue create \
              --title "MCP候補: 新規Tier1 — ${NAME}" \
              --label "candidate" \
              --body "$BODY"
          done
