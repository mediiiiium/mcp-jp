name: Weekly MCP Candidate Watch

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 9:00 JST (UTC 0:00)
  workflow_dispatch:

# state の持ち越しは artifact 経由。理由は discover-scan.yml のコメントを参照。
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx beautifulsoup4

      - name: Restore previous state from artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p notes
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=candidates-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse
                  | (first // {}) | .workflow_run.id // empty')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name candidates-state --dir notes
            echo "state 復元: run ${RUN_ID}（$(wc -c < notes/candidates_state.json) bytes）"
          else
            echo "state 無し。--watch は再評価できないので落ちます（先に月次フルスキャンを回す）。"
          fi

      - name: Run discover --watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # pipefail が無いと tee の終了ステータスに化けて、python 側の失敗が緑になる。
        run: |
          set -o pipefail
          python scripts/discover_candidates.py --watch --token "$GITHUB_TOKEN" \
            | tee /tmp/watch_output.txt

      # 変化の有無にかかわらず state は再評価で更新されるので、毎回保存する。
      - name: Save state as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidates-state
          path: notes/candidates_state.json
          retention-days: 90

      - name: Check for tier changes
        id: check
        run: |
          if grep -q "ティア変化あり" /tmp/watch_output.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create candidate --description "MCP開発候補（discover_candidates.py が検出）" --color "1D76DB" --force
          BODY=$(cat /tmp/watch_output.txt)
          gh issue create \
            --title "MCP候補 ティア変化 $(date +%Y-%m-%d)" \
            --label "candidate" \
            --body "$BODY"
