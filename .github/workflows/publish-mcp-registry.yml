# 主力コネクタを公式 MCP Registry（registry.modelcontextprotocol.io）に登録する。
#
# 流れ（コネクタごと）:
#   1. <コネクタ>/Dockerfile からイメージを作り、ghcr.io/mediiiiium/<コネクタ>-mcp:<version> に push
#      （Dockerfile の LABEL io.modelcontextprotocol.server.name が Registry の所有権確認に使われる）
#   2. そのイメージが匿名で pull できる（GHCR のパッケージが Public）かを確かめる
#   3. GitHub OIDC で Registry にログインし、<コネクタ>/server.json を publish
#
# 秘密情報は不要（GHCR は GITHUB_TOKEN、Registry は OIDC）。手動実行のみ。
#
# 初回だけ手作業が要る: GHCR のパッケージは最初の push で Private になる。
# 手順 2 で止まったら、GitHub のプロフィール → Packages → <コネクタ>-mcp → Package settings →
# Change visibility で Public にしてから、このワークフローを再実行する。
#
# server.json の version は publish ごとに一意。中身を変えたら version とイメージのタグを上げる
# （tests/test_registry.py が pyproject.toml の version との一致を確かめている）。

name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      connectors:
        description: "登録するコネクタ（JSON 配列）"
        required: true
        default: '["smarthr", "kingtime", "smaregi", "cloudsign"]'

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.16

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        connector: ${{ fromJSON(inputs.connectors) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read server.json
        id: meta
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          f="$CONNECTOR/server.json"
          test -f "$f" || { echo "::error::$f がない"; exit 1; }
          image="$(jq -r '.packages[0].identifier' "$f")"
          name="$(jq -r '.name' "$f")"
          label="$(sed -n 's/^LABEL io\.modelcontextprotocol\.server\.name="\(.*\)"$/\1/p' "$CONNECTOR/Dockerfile")"
          if [ "$label" != "$name" ]; then
            echo "::error::Dockerfile の LABEL（$label）と server.json の name（$name）が違う"; exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "repo=${image#ghcr.io/}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          CONNECTOR: ${{ matrix.connector }}
          IMAGE: ${{ steps.meta.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t "$IMAGE" "$CONNECTOR"
          docker push "$IMAGE"
          docker logout ghcr.io

      - name: Check the image is public
        env:
          CONNECTOR: ${{ matrix.connector }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          path="${REPO%:*}"; tag="${REPO##*:}"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${path}:pull" | jq -r '.token // empty' || true)"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${path}/manifests/${tag}")"
          if [ "$code" != "200" ]; then
            echo "::error::ghcr.io/${path} が匿名で pull できない（HTTP $code）。GitHub の Packages で ${CONNECTOR}-mcp を Public にしてから再実行する"
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish to MCP Registry
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          set +e
          out="$(./mcp-publisher publish "$CONNECTOR/server.json" 2>&1)"; rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            if echo "$out" | grep -qi "already exists"; then
              echo "::notice::${CONNECTOR}: この version は登録済み（変更がなければ問題ない）"
            else
              exit $rc
            fi
          fi
