name: Weekly MCP Trend Digest

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 9:00 JST (UTC 0:00)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx

      - name: Run trend digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/mcp_trend_digest.py --token "$GITHUB_TOKEN"

      - name: Ensure digest label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create mcp-digest --description "MCPエコシステム週次トレンドダイジェスト" --color "0E8A16" --force

      - name: Create digest Issue if there is new content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HAS_NEW=$(jq -r '.has_new' notes/digest_has_new.json)
          if [ "$HAS_NEW" = "true" ]; then
            gh issue create \
              --title "MCPトレンドダイジェスト $(date +%Y-%m-%d)" \
              --label "mcp-digest" \
              --body-file notes/mcp_trend_digest.md
          else
            echo "新着なし。Issueは作成しません。"
          fi

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notes/mcp_trend_state.json
          git diff --cached --quiet || git commit -m "chore(trend-digest): 週次ダイジェストで state 更新 $(date +%Y-%m-%d)"
          git push
