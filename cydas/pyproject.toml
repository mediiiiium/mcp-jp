[project]
name = "cydas-mcp"
version = "0.1.0"
description = "MCP server for CYDAS タレントマネジメントシステム (CTM 2.0 API)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
cydas-mcp = "cydas_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cydas_mcp"]
